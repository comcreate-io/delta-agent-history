[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-agent-history"
version = "0.2.0"
description = "Harness-independent coding session recording and repository-scoped recall through Delta"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ComCreate"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control",
]

[project.urls]
Repository = "https://github.com/comcreate-io/delta-agent-history"
Issues = "https://github.com/comcreate-io/delta-agent-history/issues"

[project.scripts]
delta-history = "delta_history.cli:main"
delta-history-service = "delta_history.services:main"
t3-delta = "t3_delta.cli:main"
t3-delta-service = "t3_delta.services:main"

[tool.setuptools.packages.find]
include = ["delta_history*", "t3_delta*"]

[tool.setuptools.data-files]
"share/delta-agent-history/skills/delta-history" = ["skills/delta-history/SKILL.md"]
"share/delta-agent-history/instructions" = ["instructions/project-recall.md"]
"share/delta-agent-history/schemas" = ["schemas/event.schema.json"]
"share/delta-agent-history/integrations" = ["integrations/opencode-plugin.mjs", "integrations/claude-hooks.example.json"]
"share/t3-delta-recorder/skills/t3-delta-history" = ["skills/t3-delta-history/SKILL.md"]
"share/t3-delta-recorder/instructions" = ["instructions/project-recall.md"]
