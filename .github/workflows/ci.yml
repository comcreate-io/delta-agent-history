name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests with synthetic data
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/recorder-smoke"
          "$RUNNER_TEMP/recorder-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/recorder-smoke/bin/t3-delta" --help
          "$RUNNER_TEMP/recorder-smoke/bin/t3-delta-service" --help
          "$RUNNER_TEMP/recorder-smoke/bin/delta-history" --help
          "$RUNNER_TEMP/recorder-smoke/bin/delta-history-service" --help
          "$RUNNER_TEMP/recorder-smoke/bin/delta-history" enroll --help
          test -f "$RUNNER_TEMP/recorder-smoke/share/t3-delta-recorder/skills/t3-delta-history/SKILL.md"
          test -f "$RUNNER_TEMP/recorder-smoke/share/t3-delta-recorder/instructions/project-recall.md"
          test -f "$RUNNER_TEMP/recorder-smoke/share/delta-agent-history/skills/delta-history/SKILL.md"
          test -f "$RUNNER_TEMP/recorder-smoke/share/delta-agent-history/skills/delta-enroll/SKILL.md"
          test -f "$RUNNER_TEMP/recorder-smoke/share/delta-agent-history/instructions/project-enrollment.md"
          test -f "$RUNNER_TEMP/recorder-smoke/share/delta-agent-history/schemas/event.schema.json"
          test -f "$RUNNER_TEMP/recorder-smoke/share/delta-agent-history/integrations/opencode-plugin.mjs"
