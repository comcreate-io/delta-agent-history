name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests with synthetic data
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/recorder-smoke"
          "$RUNNER_TEMP/recorder-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/recorder-smoke/bin/t3-delta" --help
          "$RUNNER_TEMP/recorder-smoke/bin/t3-delta-service" --help
          test -f "$RUNNER_TEMP/recorder-smoke/share/t3-delta-recorder/skills/t3-delta-history/SKILL.md"
          test -f "$RUNNER_TEMP/recorder-smoke/share/t3-delta-recorder/instructions/project-recall.md"
